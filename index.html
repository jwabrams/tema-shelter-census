<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Displays shelter and linked census records for a given GlobalID." />
  <meta name="author" content="Tennessee Emergency Management Agency (TEMA)" />
  <title>Shelter Census Summary</title>

  <!-- ArcGIS JSAPI -->
  <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css" />
  <script src="https://js.arcgis.com/4.29/"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #eef1f5;
      color: #222;
      padding: 24px;
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 { font-size: 1.4em; color: #1a3a5c; margin-bottom: 4px; }
    #subtitle { font-size: 0.82em; color: #888; margin-bottom: 20px; font-family: monospace; }

    #status {
      font-size: 0.82em;
      min-height: 1.4em;
      margin-bottom: 16px;
      color: #555;
    }
    #status.error { color: #b00; font-weight: bold; }
    #status.ok    { color: #1a7a3a; }

    .card {
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      margin-bottom: 24px;
      overflow: hidden;
      display: none;
    }
    .card-header {
      background: #1a3a5c;
      color: #fff;
      padding: 10px 16px;
      font-size: 0.9em;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: #fff;
      color: #1a3a5c;
      font-size: 0.75em;
      padding: 2px 10px;
      border-radius: 10px;
      font-weight: bold;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    }
    .field-item {
      padding: 10px 16px;
      border-bottom: 1px solid #eee;
      border-right: 1px solid #eee;
    }
    .field-label {
      font-size: 0.7em;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 3px;
    }
    .field-value { font-size: 0.88em; word-break: break-word; }
    .field-value.empty { color: #ccc; font-style: italic; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82em; }
    thead tr { background: #2c5f8a; color: #fff; }
    th { padding: 9px 12px; text-align: left; white-space: nowrap; }
    tbody tr:nth-child(even) { background: #f4f7fb; }
    tbody tr:hover { background: #dde8f5; }
    td { padding: 7px 12px; border-bottom: 1px solid #e8e8e8; vertical-align: top; }
    #no-census { text-align: center; color: #999; padding: 20px; font-size: 0.85em; }
  </style>
</head>
<body>

<h1>Shelter Census Summary</h1>
<p id="subtitle">Initializing…</p>
<div id="status"></div>

<div id="shelter-card" class="card">
  <div class="card-header">
    🏠 Shelter Record
    <span class="badge" id="shelter-name"></span>
  </div>
  <div class="field-grid" id="shelter-fields"></div>
</div>

<div id="census-card" class="card">
  <div class="card-header">
    📋 Census Records
    <span class="badge" id="census-count">0</span>
  </div>
  <div class="table-wrap">
    <table>
      <thead id="census-head"></thead>
      <tbody id="census-body"></tbody>
    </table>
  </div>
</div>

<script>
  // ── Config ────────────────────────────────────────────────────────────────
  const SHELTER_URL = "https://services1.arcgis.com/kILp9lqGUeOhnDbI/arcgis/rest/services/service_570f1aad0c2641e7beac6dfca700747e/FeatureServer/0";
  const CENSUS_URL  = "https://services1.arcgis.com/kILp9lqGUeOhnDbI/ArcGIS/rest/services/Shelter_Census_View_Only/FeatureServer/0";
  const PORTALS     = [
    "https://temahub.maps.arcgis.com",
    "https://tnema.maps.arcgis.com",
  ];

  const SHELTER_SKIP = new Set(["objectid", "OBJECTID", "Shape__Area", "Shape__Length"]);
  const CENSUS_SKIP  = new Set(["objectid", "OBJECTID", "globalid", "GlobalID", "Shape__Area", "Shape__Length"]);

  const statusEl = document.getElementById("status");

  function setStatus(msg, type = "") {
    statusEl.textContent = msg;
    statusEl.className = type;
  }

  function fmt(v) {
    if (typeof v === "number" && v > 1_000_000_000_000) return new Date(v).toLocaleString();
    return v;
  }

  async function queryLayer(layerUrl, where) {
    const { default: esriRequest } = await $arcgis.import("esri/request");
    const res = await esriRequest(`${layerUrl}/query`, {
      query: { where, outFields: "*", returnGeometry: false, f: "json" },
      responseType: "json",
    });
    if (res.data.error) throw new Error(res.data.error.message);
    return res.data.features || [];
  }

  function renderShelter(attrs) {
    const el = document.getElementById("shelter-fields");
    el.innerHTML = "";
    const name = attrs.shelter_name || attrs.ShelterName || attrs.name || attrs.Name || "";
    document.getElementById("shelter-name").textContent = name;
    for (const [k, v] of Object.entries(attrs)) {
      if (SHELTER_SKIP.has(k)) continue;
      const item = document.createElement("div");
      item.className = "field-item";
      const lbl = document.createElement("div");
      lbl.className = "field-label";
      lbl.textContent = k;
      const val = document.createElement("div");
      const display = fmt(v);
      val.className = "field-value" + (display == null || display === "" ? " empty" : "");
      val.textContent = display != null && display !== "" ? display : "—";
      item.appendChild(lbl);
      item.appendChild(val);
      el.appendChild(item);
    }
    document.getElementById("shelter-card").style.display = "";
  }

  function renderCensus(features) {
    const headEl = document.getElementById("census-head");
    const bodyEl = document.getElementById("census-body");
    headEl.innerHTML = "";
    bodyEl.innerHTML = "";
    document.getElementById("census-count").textContent = features.length;
    document.getElementById("census-card").style.display = "";
    if (features.length === 0) {
      bodyEl.innerHTML = `<tr><td id="no-census" colspan="99">No census records linked to this shelter.</td></tr>`;
      return;
    }
    const keys = Object.keys(features[0].attributes).filter(k => !CENSUS_SKIP.has(k));
    const htr = document.createElement("tr");
    for (const k of keys) {
      const th = document.createElement("th");
      th.textContent = k;
      htr.appendChild(th);
    }
    headEl.appendChild(htr);
    for (const f of features) {
      const tr = document.createElement("tr");
      for (const k of keys) {
        const td = document.createElement("td");
        td.textContent = fmt(f.attributes[k]) ?? "—";
        tr.appendChild(td);
      }
      bodyEl.appendChild(tr);
    }
  }

  // ── Register service worker ───────────────────────────────────────────────
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(err => {
      console.warn("SW registration failed:", err);
    });
  }

  // ── Main ──────────────────────────────────────────────────────────────────
  require(["esri/identity/IdentityManager", "esri/portal/Portal"], async (IdentityManager, Portal) => {
    try {
      const params   = new URLSearchParams(window.location.search);
      const globalid = params.get("id");

      if (!globalid) {
        setStatus("No GlobalID provided. Add ?id={GlobalID} to the URL.", "error");
        document.getElementById("subtitle").textContent = "Missing required URL parameter.";
        return;
      }

      document.getElementById("subtitle").textContent = `GlobalID: ${globalid}`;
      setStatus("Checking session…");

      // Try each portal for an active session
      let portal = null;
      for (const url of PORTALS) {
        try {
          const p = new Portal({ url });
          await p.load();
          if (p.user) { portal = p; break; }
        } catch (_) { /* not logged in here, try next */ }
      }

      if (!portal) {
        const returnUrl = encodeURIComponent(window.location.href);
        window.location.href = `https://temahub.maps.arcgis.com/home/signin.html?returnUrl=${returnUrl}`;
        return;
      }

      const safeGID = globalid.replace(/'/g, "''");

      setStatus("Querying shelter record…");
      const shelterFeatures = await queryLayer(SHELTER_URL, `GlobalID = '${safeGID}'`);

      if (shelterFeatures.length === 0) {
        setStatus(`No shelter record found for GlobalID: ${globalid}`, "error");
        return;
      }

      renderShelter(shelterFeatures[0].attributes);

      setStatus("Querying census records…");
      const censusFeatures = await queryLayer(CENSUS_URL, `dataid = '${safeGID}'`);

      renderCensus(censusFeatures);
      setStatus(`Loaded — ${censusFeatures.length} census record(s).`, "ok");

    } catch (err) {
      setStatus(`Error: ${err.message}`, "error");
      console.error(err);
    }
  });
</script>

</body>
</html>
