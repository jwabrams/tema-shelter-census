<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shelter Census</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", Arial, sans-serif; background: #f4f6f9; color: #1a1a1a; padding: 2rem; }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.25rem; color: #003865; }
    #subtitle { font-size: 0.85rem; color: #666; margin-bottom: 1.5rem; }
    #status { font-size: 0.9rem; color: #555; margin-bottom: 1rem; min-height: 1.2em; }
    #status.error { color: #c0392b; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    thead { background: #003865; color: #fff; }
    th, td { padding: 0.65rem 1rem; text-align: left; font-size: 0.9rem; }
    tbody tr:nth-child(even) { background: #f0f4f8; }
    tbody tr:hover { background: #dce8f5; }
    td.count { font-weight: 600; text-align: right; }
    th.count { text-align: right; }
    #no-data { display: none; margin-top: 1rem; color: #888; font-style: italic; }
    footer { margin-top: 1.5rem; font-size: 0.75rem; color: #aaa; }
  </style>
</head>
<body>

<h1>Shelter Census</h1>
<div id="subtitle">People count per night/day for selected shelter</div>
<div id="status">Loading…</div>
<table id="census-table" style="display:none">
  <thead>
    <tr>
      <th>Night/Day</th>
      <th class="count">People Count</th>
    </tr>
  </thead>
  <tbody id="census-body"></tbody>
</table>
<div id="no-data">No census records found for this shelter.</div>
<footer id="footer"></footer>

<script>
const CONFIG = {
  censusLayerUrl: "https://services1.arcgis.com/kILp9lqGUeOhnDbI/arcgis/rest/services/Shelter_Census_View_Only/FeatureServer",
  shelterGlobalIdField: "dataid",
  dateField: "shelter_date",
  countField: "census",
};

function setStatus(msg, isError = false) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = isError ? "error" : "";
}

function formatDate(ts) {
  if (!ts) return "—";
  return new Date(ts).toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
}

async function loadCensusData() {
  console.log("[ShelterCensus] started");

  // 1. Get GlobalID from URL param
  const params = new URLSearchParams(window.location.search);
  const globalId = params.get("globalid");
  console.log("[ShelterCensus] globalid:", globalId);

  if (!globalId) {
    setStatus("No shelter GlobalID provided in the URL (?globalid=...).", true);
    return;
  }

  document.getElementById("footer").textContent = `Shelter GlobalID: ${globalId}`;
  setStatus("Querying census records…");

  // 2. Build query — no token needed, service is public
  const where = `${CONFIG.shelterGlobalIdField} = '${globalId}'`;
  const url = new URL(`${CONFIG.censusLayerUrl}/query`);
  url.searchParams.set("where", where);
  url.searchParams.set("outFields", `${CONFIG.dateField},${CONFIG.countField}`);
  url.searchParams.set("orderByFields", `${CONFIG.dateField} ASC`);
  url.searchParams.set("f", "json");

  console.log("[ShelterCensus] querying:", url.toString());

  let data;
  try {
    const res = await fetch(url.toString());
    console.log("[ShelterCensus] HTTP status:", res.status);
    data = await res.json();
    console.log("[ShelterCensus] response:", data);
  } catch (err) {
    setStatus(`Network error: ${err.message}`, true);
    return;
  }

  if (data.error) {
    setStatus(`Service error ${data.error.code}: ${data.error.message}`, true);
    return;
  }

  const features = data.features ?? [];

  if (features.length === 0) {
    setStatus("");
    document.getElementById("no-data").style.display = "block";
    return;
  }

  // 3. Render table
  const tbody = document.getElementById("census-body");
  let total = 0;

  features.forEach(f => {
    const attrs = f.attributes;
    const night = formatDate(attrs[CONFIG.dateField]);
    const count = attrs[CONFIG.countField] ?? 0;
    total += count;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${night}</td><td class="count">${count.toLocaleString()}</td>`;
    tbody.appendChild(tr);
  });

  const totalRow = document.createElement("tr");
  totalRow.style.cssText = "background:#003865;color:#fff;font-weight:700";
  totalRow.innerHTML = `<td>Total (${features.length} nights)</td><td class="count">${total.toLocaleString()}</td>`;
  tbody.appendChild(totalRow);

  setStatus(`Showing ${features.length} night(s) of census data.`);
  document.getElementById("census-table").style.display = "table";
}

loadCensusData();
</script>
</body>
</html>
