<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shelter Census</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6f9;
      color: #1a1a1a;
      padding: 2rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: #003865;
    }

    #subtitle {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 1.5rem;
    }

    #status {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 1rem;
      min-height: 1.2em;
    }

    #status.error { color: #c0392b; font-weight: 600; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    thead { background: #003865; color: #fff; }
    th, td { padding: 0.65rem 1rem; text-align: left; font-size: 0.9rem; }
    tbody tr:nth-child(even) { background: #f0f4f8; }
    tbody tr:hover { background: #dce8f5; }

    td.count { font-weight: 600; text-align: right; }
    th.count { text-align: right; }

    #no-data {
      display: none;
      margin-top: 1rem;
      color: #888;
      font-style: italic;
    }

    footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #aaa;
    }
  </style>
</head>
<body>

<h1>Shelter Census</h1>
<div id="subtitle">People count per night/day for selected shelter</div>
<div id="status">Loading…</div>
<table id="census-table" style="display:none">
  <thead>
    <tr>
      <th>Night/Day</th>
      <th class="count">People Count</th>
    </tr>
  </thead>
  <tbody id="census-body"></tbody>
</table>
<div id="no-data">No census records found for this shelter.</div>

<footer id="footer"></footer>

<script>
// ─────────────────────────────────────────────
// ✏️  CONFIGURE THESE VALUES
// ─────────────────────────────────────────────

const CONFIG = {
  // Full REST URL to your census/people-count feature layer (include layer index)
  // e.g. "https://services.arcgis.com/ABC123/arcgis/rest/services/ShelterCensus/FeatureServer/0"
  censusLayerUrl: "https://services1.arcgis.com/kILp9lqGUeOhnDbI/ArcGIS/rest/services/Shelter_Census_View_Only/FeatureServer/0",

  // Field in the census layer that stores the shelter GlobalID (the foreign key)
  // This is the field that links a census record back to its parent shelter
  shelterGlobalIdField: "dataid",   // ✏️ rename to your actual FK field name

  // Date/datetime field representing the night of the count
  dateField: "shelter_date",                   // ✏️ rename to your actual date field name

  // Numeric field holding the total people count for that night
  countField: "census",                  // ✏️ rename to your actual count field name

  // Your AGOL portal base URL (no trailing slash)
  portalUrl: "https://tnema.maps.arcgis.com",        // ✏️ change if on a portal (e.g. https://yourorg.maps.arcgis.com)
};

// ─────────────────────────────────────────────
// TOKEN — pulled from esri.arcgisPortal cookie
// ─────────────────────────────────────────────

/**
 * Reads the esri.arcgisPortal cookie, parses the JSON it contains,
 * and returns the token string. Returns null if not found or not logged in.
 *
 * NOTE: This cookie is HttpOnly in some AGOL configurations. If token
 * comes back null, see the fallback section below.
 */
function getTokenFromCookie() {
  const raw = document.cookie
    .split("; ")
    .find(row => row.startsWith("esri.arcgisPortal="));
  if (!raw) return null;

  try {
    const val = decodeURIComponent(raw.split("=").slice(1).join("="));
    const parsed = JSON.parse(val);
    // The cookie stores an array of credential objects; grab the first token
    if (Array.isArray(parsed) && parsed[0]?.token) return parsed[0].token;
    if (parsed?.token) return parsed.token;
  } catch {
    // Cookie exists but isn't the expected JSON shape
  }
  return null;
}

/**
 * FALLBACK: If the cookie approach returns null (HttpOnly flag),
 * try the AGOL /sharing/rest/info endpoint — it echoes the token
 * for a logged-in session via XHR from the same origin.
 * Uncomment this block and call it instead of getTokenFromCookie() if needed.
 *
async function getTokenFromPortalInfo() {
  const res = await fetch(
    `${CONFIG.portalUrl}/sharing/rest/portals/self?f=json`,
    { credentials: "include" }
  );
  const data = await res.json();
  return data?.token ?? null;
}
*/

// ─────────────────────────────────────────────
// MAIN
// ─────────────────────────────────────────────

function setStatus(msg, isError = false) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = isError ? "error" : "";
}

function formatDate(esriTimestamp) {
  if (!esriTimestamp) return "—";
  const d = new Date(esriTimestamp);
  return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
}

async function loadCensusData() {
  console.log("[ShelterCensus] loadCensusData() started");

  // 1. Get GlobalID from URL param
  const params = new URLSearchParams(window.location.search);
  const globalId = params.get("globalid");
  console.log("[ShelterCensus] globalid param:", globalId);

  if (!globalId) {
    setStatus("No shelter GlobalID provided in the URL (?globalid=...).", true);
    return;
  }

  document.getElementById("footer").textContent = `Shelter GlobalID: ${globalId}`;

  // 2. Get token from cookie
  const token = getTokenFromCookie();
  console.log("[ShelterCensus] token from cookie:", token ? "FOUND (" + token.substring(0,10) + "...)" : "NULL — not found");
  // If using the fallback, replace with: const token = await getTokenFromPortalInfo();

  if (!token) {
    setStatus(
      "Could not retrieve an AGOL session token. Make sure you are logged in to ArcGIS Online " +
      "in this browser and that this page is served from the same domain, or switch to the " +
      "portal info fallback method.",
      true
    );
    return;
  }

  setStatus("Querying census records…");

  // 3. Build query
  console.log("[ShelterCensus] building query against:", CONFIG.censusLayerUrl); — match on the shelter FK field using the GlobalID
  //    AGOL GlobalIDs must be wrapped in single quotes in WHERE clauses
  const where = `${CONFIG.shelterGlobalIdField} = '${globalId}'`;

  const queryUrl = new URL(`${CONFIG.censusLayerUrl}/query`);
  queryUrl.searchParams.set("where", where);
  queryUrl.searchParams.set("outFields", `${CONFIG.dateField},${CONFIG.countField}`);
  queryUrl.searchParams.set("orderByFields", `${CONFIG.dateField} ASC`);
  queryUrl.searchParams.set("f", "json");
  queryUrl.searchParams.set("token", token);

  let data;
  try {
    console.log("[ShelterCensus] fetching:", queryUrl.toString().replace(token, "TOKEN_REDACTED"));
    const res = await fetch(queryUrl.toString());
    console.log("[ShelterCensus] HTTP status:", res.status);
    data = await res.json();
    console.log("[ShelterCensus] response:", data);
  } catch (err) {
    setStatus(`Network error: ${err.message}`, true);
    return;
  }

  if (data.error) {
    setStatus(`Service error ${data.error.code}: ${data.error.message}`, true);
    return;
  }

  const features = data.features ?? [];

  if (features.length === 0) {
    setStatus("");
    document.getElementById("no-data").style.display = "block";
    return;
  }

  // 4. Render table
  const tbody = document.getElementById("census-body");
  let totalPeople = 0;

  features.forEach(f => {
    const attrs = f.attributes;
    const night = formatDate(attrs[CONFIG.dateField]);
    const count = attrs[CONFIG.countField] ?? 0;
    totalPeople += count;

    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${night}</td><td class="count">${count.toLocaleString()}</td>`;
    tbody.appendChild(tr);
  });

  // Total row
  const totalRow = document.createElement("tr");
  totalRow.style.cssText = "background:#003865;color:#fff;font-weight:700";
  totalRow.innerHTML = `
    <td>Total (${features.length} nights)</td>
    <td class="count">${totalPeople.toLocaleString()}</td>
  `;
  tbody.appendChild(totalRow);

  setStatus(`Showing ${features.length} night(s) of census data.`);
  document.getElementById("census-table").style.display = "table";
}

loadCensusData();
</script>
</body>
</html>
